{% for book in books %}
{% if not book.availability.in_stock %}
<div id="reserve-modal-{{ book.id }}" class="modal">
    <div class="modal-backdrop"></div>
    <div class="modal-dialog">
        <div class="modal-header">
            <h3 class="modal-title"><i class="fas fa-bookmark"></i> Place Reservation</h3>
            <button type="button" class="modal-close" data-close-modal aria-label="Close">&times;</button>
        </div>
        <form method="POST" action="{{ url_for('search.reserve', book_id=book.id) }}">
            <div class="modal-body">
                <p>Reserve <strong>{{ book.title }}</strong>? You will be added to the hold queue.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" data-close-modal>Cancel</button>
                <button type="submit" class="btn-primary-square"><i class="fas fa-check"></i> Confirm Reservation</button>
            </div>
        </form>
    </div>
</div>
{% endif %}
{% endfor %}
