<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Login - Library Management System</title>
    <link rel="icon" href="{{ url_for('static', filename='images/bcp-logo.png') }}" type="image/png">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/bcp-logo.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
    <style>
        .login-bg {
            background-image: url("{{ login_bg_url }}");
        }
    </style>
</head>
<body class="login-bg flex items-center justify-center p-4">
    <div class="login-floating-books" aria-hidden="true">
        <i class="fas fa-book floating-book"></i>
        <i class="fas fa-book-open floating-book"></i>
        <i class="fas fa-bookmark floating-book"></i>
        <i class="fas fa-graduation-cap floating-book"></i>
        <i class="fas fa-feather floating-book"></i>
        <i class="fas fa-scroll floating-book"></i>
    </div>

    <div class="login-card">
        <div class="text-center mb-5">
            <img src="{{ url_for('static', filename='images/bcp-logo.png') }}" alt="Bestlink College of the Philippines" class="login-logo">
            <h1 class="login-title">Library Management System</h1>
            <p class="login-tagline" id="login-tagline"></p>
        </div>

        {% if error %}
        <div class="flash-message mb-4 px-4 py-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded-lg">
            <i class="fas fa-circle-exclamation mr-1"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-3">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="login-field">
                <i class="fas fa-user login-input-icon" aria-hidden="true"></i>
                <input type="text" name="username" placeholder="Username" required class="login-input" autocomplete="username">
            </div>
            <div class="login-field">
                <i class="fas fa-key login-input-icon" aria-hidden="true"></i>
                <input type="password" name="password" id="password" placeholder="Password" required class="login-input login-input-password" autocomplete="current-password">
                <button type="button" onclick="togglePassword()" class="login-password-toggle" aria-label="Toggle password visibility">
                    <i class="fas fa-eye" id="eye-icon"></i>
                </button>
            </div>
            <p class="text-center text-xs text-slate-500 pt-1">Forgotten your username or password?</p>
            <button type="submit" class="btn-primary w-full py-3 text-sm mt-1">
                <i class="fas fa-right-to-bracket mr-1"></i> Log in
            </button>
        </form>

        <div class="instructions-box mt-5">
            <p class="instructions-title"><i class="fas fa-circle-info mr-1"></i> INSTRUCTIONS</p>
            <ol class="list-decimal list-inside space-y-1 mt-1">
                <li>Your LMS and Library System use the same login credentials.</li>
                <li>For login assistance, visit the Library Office at the Main Building.</li>
            </ol>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
</body>
</html>
